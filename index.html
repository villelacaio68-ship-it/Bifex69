<style>
:root {
  --site-primary: #6657e8;
  --site-on-primary: #ffffff;
  --site-secondary: #15213a;
  --site-on-secondary: #f5f7ff;
  --site-background: #101522;
  --site-on-background: #f5f6ff;
  --site-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --site-font-heading: Inter, ui-sans-serif, system-ui, sans-serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
  color-scheme: light dark;
}
* { box-sizing: border-box; }
body { margin:0; font-family:var(--site-font-body); background:light-dark(#f4f5fb,#101522); color:light-dark(#172039,#f5f6ff); }
.app { min-height:100vh; width:100%; border-radius:0; background-color:var(--site-background); color:var(--site-on-background); overflow:hidden; position:relative; }
.glow { position:absolute; width:420px; height:420px; border-radius:50%; filter:blur(90px); opacity:calc(.22 * var(--site-decoration-opacity)); background:var(--site-primary); top:-210px; left:calc(50% - 210px); pointer-events:none; }
header { position:relative; z-index:1; max-width:900px; margin:auto; padding:24px 24px 12px; display:flex; align-items:center; justify-content:space-between; }
.brand { font-weight:850; letter-spacing:-.06em; font-size:20px; }
.brand span { color:#a69cff; }
main { position:relative; z-index:1; width:min(100% - 32px,560px); margin:42px auto 0; text-align:center; }
.avatar { width:112px; height:112px; border-radius:50%; object-fit:cover; border:4px solid rgba(255,255,255,.18); box-shadow:0 12px 36px rgba(0,0,0,.32); }
h1 { font-family:var(--site-font-heading); font-size:calc(34px * var(--site-heading-scale)); line-height:1.1; letter-spacing:-.045em; margin:20px 0 8px; }
.handle { color:#aeb6cb; font-size:14px; font-weight:650; }
.bio { color:#c5cadd; line-height:1.6; margin:18px auto 28px; max-width:390px; }
.links { display:grid; gap:13px; margin:0 auto; }
.social { display:flex; align-items:center; gap:15px; padding:16px 18px; text-decoration:none; color:white; text-align:left; border-radius:calc(17px * var(--site-radius-scale)); background:var(--site-secondary); border:1px solid rgba(255,255,255,.1); box-shadow:0 10px 25px rgba(0,0,0,.16); transition:transform .18s ease,border-color .18s ease; }
.social:hover { transform:translateY(-3px); border-color:rgba(255,255,255,.34); }
.social .ico { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; flex:none; background:rgba(255,255,255,.11); }
.social strong { display:block; font-size:16px; }
.social small { display:block; color:#aeb6cb; margin-top:3px; }
.arrow { margin-left:auto; color:#aeb6cb; font-size:22px; }
.note { color:#8d96ae; font-size:12px; margin:34px 0 28px; }
footer { padding:24px; text-align:center; color:#7e879e; font-size:12px; }
@media(min-width:700px) { main { margin-top:56px; } .avatar { width:124px;height:124px; } }
</style>
